[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-exigences"
version = "0.1.0"
description = "Outil d'audit de qualite des exigences automobiles"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
eval = ["deepeval>=4.0.9,<5"]

[project.scripts]
audit-exigences = "audit_exigences.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
