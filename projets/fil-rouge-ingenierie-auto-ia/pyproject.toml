[project]
name = "auto-ai-flow"
version = "0.1.0"
description = "Fil rouge d'ingenierie automobile orchestre par des agents IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
auto-ai-flow = "auto_ai_flow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_ai_flow"]
