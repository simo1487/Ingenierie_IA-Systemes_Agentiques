[project]
name = "formation-ia-rag-lab"
version = "0.1.0"
description = "Exercices et exemples RAG pour la formation IA avec LlamaIndex et Qdrant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "qdrant-client>=1.9.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
